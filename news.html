<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffffff;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
            padding: 15px;
        }
        .news-item {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333333;
        }
        .news-item:last-child {
            border-bottom: none;
        }
        .news-date {
            color: #888888;
            font-size: 12px;
        }
        .news-title {
            color: #000000;
            font-weight: bold;
            margin: 3px 0;
        }
        .news-desc {
            color: #cccccc;
        }
        a {
            color: #5d8c3a;
        }
        p, span, div {
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="news-item">
        <div class="news-date">[13/04/2026]</div>
        <div class="news-title">Polymade Launcher</div>
        <div>Polymade! Launcher by Juniz.</div>
    </div>
    <div class="news-item">
        <div class="news-date">[8/07/2026]</div>
        <div class="news-title">Polymade's first installment</div>
        <div>Enjoy the public Pre-Alpha release!</div>
    </div>
    <div class="news-item">
        <div class="news-date">[23/08/2026]</div>
        <div class="news-title">Polymade's second installment</div>
        <div>Music, Shop, Micropieces, Spinning blocks & more, Alpha 1 release!</div>
    </div>
</body>
</html>
